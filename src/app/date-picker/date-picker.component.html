<div class="calendar">
  <div class="calendar_left">
    <div>{{ navDate.format('D') }}</div>
    <div>{{ navDate.format('dddd') }}</div>
  </div>
  <div class="calendar_right">
    <div class="d-flex justify-content-end">
      <button (click)="prevYear()">prev</button>
      <span class="pl-1 pr-1">{{ navDate.format('YYYY') }}</span>
      <button (click)="nextYear()">next</button>
    </div>
    <div class="header">
      <div
        class="calendar-date"
        *ngFor="let month of monthsHeader"
        (click)="updateMonth(month)"
      >
        {{ month }}
      </div>
    </div>
    <div class="header">
      <div class="calendar-date" *ngFor="let day of weekDaysHeaderArr">
        {{ day }}
      </div>
    </div>
    <div class="dates">
      <div *ngFor="let day of gridArr">
        <div *ngIf="day.value !== 0" class="date_item" (click)="selectDay(day)">
          {{ day.value }}
        </div>
        <div *ngIf="day.value === 0" class="date_item"></div>
      </div>
    </div>
  </div>
</div>
