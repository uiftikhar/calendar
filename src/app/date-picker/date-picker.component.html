<div class="calendar">
  <div class="calendar_left">
    <div class="d-flex flex-column align-items-center">
      <h1 class="m-0 p-0 date">{{ activeDate.format('DD') }}</h1>
      <div class="day">{{ activeDate.format('dddd') }}</div>
    </div>
    <div class="events mt-5">
      <h6 class="white">Current Events</h6>
      <ul class="m-0" *ngFor="let event of currentEvents">
        <li class="m-0">{{ event.title }}</li>
      </ul>
    </div>
  </div>
  <div class="calendar_right">
    <div class="d-flex justify-content-end">
      <div mat-icon-button (click)="prevYear()">
        <mat-icon>arrow_left</mat-icon>
      </div>
      <span class="pl-1 pr-1">{{ navDate.format('YYYY') }}</span>
      <div (click)="nextYear()"><mat-icon>arrow_right</mat-icon></div>
    </div>
    <div class="header d-flex justify-content-around">
      <div
        class="calendar-date"
        *ngFor="let month of monthsHeader"
        (click)="updateMonth(month)"
      >
        {{ month }}
      </div>
    </div>
    <div class="header d-flex justify-content-around mb-2">
      <div class="calendar-date" *ngFor="let day of weekDaysHeaderArr">
        {{ day }}
      </div>
    </div>
    <div class="dates">
      <div *ngFor="let day of gridArr">
        <div
          class="date_item"
          [ngClass]="{ disabled: !day.isSelectedMonth }"
          (click)="selectDay(day)"
        >
          <div class="event" *ngIf="day.event.length > 0"></div>
          <div [ngClass]="{ active: day.isActive }">
            {{ day.value.format('DD') }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
